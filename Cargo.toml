[package]
name = "budget_monitor"
version = "1.0.0"
edition = "2021"
description = "Budget Monitoring System (Rust recreation of the PESO Access/VBA Budget Monitor)"

[dependencies]
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"

